[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.98"
description = "Gilvave is a cross-platform, open-source chat application built with Rust and Tauri."
authors = ["KIM", "Adam"]
edition = "2024"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = [
    "serde",
    "formatting",
    "parsing",
    "macros",
    "wasm-bindgen",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
web-sys = { version = "0.3", features = [
    "HtmlSelectElement",
    "Element",
    "HtmlElement",
    "Navigator",
    "Window",
    "Document",
    "HtmlDocument",
    "RequestInit",
    "RequestCredentials",
    "Request",
    "Response",
    "Headers",
    "AbortController",
    "ReadableStream",
    "Storage",
    "CssStyleDeclaration",
    "KeyboardEvent",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "HtmlImageElement",
    "Node",
    "NodeList",
    "Text",
    "Selection",
    "Range",
    "ClipboardEvent",
    "Clipboard",
    "Navigator",
    "DataTransfer",
    "DataTransferItemList",
    "DataTransferItem",
    "DomTokenList",
    "FileReader",
    "Url",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "FileList",
    "File",
    "FormData",
    "Blob",
    "TouchEvent",
    "TouchList",
    "Touch",
] }

[profile.dev]
debug = 1

# Отключить генерацию отладочных символов для ВСЕХ сторонних зависимостей
[profile.dev.package."*"]
debug = 0
