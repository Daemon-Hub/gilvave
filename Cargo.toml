[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
rust-version = "1.98"
description = "Gilvave is a cross-platform, open-source chat application built with Rust and Tauri."
authors = ["KIM", "Adam"]
edition = "2024"

[workspace.dependencies]
futures-util = "0.3.34"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "stream",
] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
time = { version = "0.3.55", features = [
    "formatting",
    "macros",
    "parsing",
    "serde",
    "wasm-bindgen",
] }
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-sys = { version = "0.3.107", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "File",
    "FileList",
    "FileReader",
    "FormData",
    "Headers",
    "HtmlCanvasElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlVideoElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Range",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Selection",
    "Storage",
    "Text",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Url",
    "Window",
] }

[profile.dev]
debug = 0
strip = "debuginfo"

# Отключить генерацию отладочных символов для ВСЕХ сторонних зависимостей
[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3        # максимум скорости (инлайнинг, SIMD/векторизация) для нативной части
lto = "fat"          # межкрейтовая глобальная оптимизация
codegen-units = 1    # компиляция единым блоком: лучшие оптимизации, но дольше сборка
strip = "debuginfo"  # из отладочных символов оставляем только имена функций
panic = "abort"      # убирает таблицы раскрутки стека
