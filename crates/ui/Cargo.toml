[package]
name = "gilvave-ui"
version.workspace = true
description.workspace = true
edition.workspace = true


[dependencies]
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", features = [
    "core",
    "event",
    "app",
] }
validator = { version = "0.21.0", features = ["derive"] }
sycamore = { version = "0.9", features = ["suspense"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
wasm-streams = "0.7" # ReadableStream → Rust Stream
ws_stream_wasm = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
serde_json.workspace = true
serde.workspace = true
strum.workspace = true
futures-util.workspace = true
futures-channel = "0.3"
tracing.workspace = true
time.workspace = true
web-sys.workspace = true

gilvave-core = { path = "../core" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
